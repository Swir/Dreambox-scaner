name: Windows Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: pytest

      - name: Build Windows icon
        run: python tools/build_icon.py

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name DreamboxScanner --icon assets/dreambox-scanner.ico --paths src main.py

      - name: Smoke-test executable
        shell: pwsh
        run: |
          .\dist\DreamboxScanner.exe --version

      - name: Resolve release tag
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/*") {
            $tag = "${{ github.ref_name }}"
          } else {
            $version = python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
            $tag = "v$version"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "name=Dreambox Scanner $tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Package portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/DreamboxScanner.exe package/DreamboxScanner.exe
          Copy-Item README.md package/README.md
          Copy-Item CHANGELOG.md package/CHANGELOG.md
          Compress-Archive -Path package/* -DestinationPath "DreamboxScanner-${{ steps.meta.outputs.tag }}-Windows-x64.zip" -Force
          $hash = (Get-FileHash "DreamboxScanner-${{ steps.meta.outputs.tag }}-Windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  DreamboxScanner-${{ steps.meta.outputs.tag }}-Windows-x64.zip" | Set-Content "DreamboxScanner-${{ steps.meta.outputs.tag }}-Windows-x64.zip.sha256"
          $exeHash = (Get-FileHash "dist/DreamboxScanner.exe" -Algorithm SHA256).Hash.ToLower()
          "$exeHash  DreamboxScanner.exe" | Set-Content "DreamboxScanner.exe.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.name }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/DreamboxScanner.exe
            DreamboxScanner.exe.sha256
            DreamboxScanner-${{ steps.meta.outputs.tag }}-Windows-x64.zip
            DreamboxScanner-${{ steps.meta.outputs.tag }}-Windows-x64.zip.sha256
