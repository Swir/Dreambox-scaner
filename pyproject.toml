[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dreambox-scanner"
version = "6.1.0"
description = "Authorized LAN diagnostics for Dreambox, Enigma2 and related media devices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32.3,<3",
  "rich>=13.9.4,<15",
  "urllib3>=2.2,<3",
]
authors = [{name = "Swir"}]
keywords = ["dreambox", "enigma2", "network", "diagnostics", "kodi", "tvheadend"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Topic :: System :: Networking",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "Pillow>=10.4,<12",
  "pyinstaller>=6.11,<7",
]

[project.scripts]
dreambox-scanner = "dreambox_scanner.cli:main"
dreambox-scanner-gui = "dreambox_scanner.gui:launch_gui"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
